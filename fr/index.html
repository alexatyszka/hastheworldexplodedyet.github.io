<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="fr" href="/fr/" />
    <link rel="alternate" hreflang="pl" href="/pl/" />
    <title>LE MONDE A-T-IL DÉJÀ EXPLOSÉ ?</title>
  </head>
  <body>
    <nav class="lang">
      <a href="/" hreflang="en">EN</a>
      &middot;
      <a href="/fr/" aria-current="page">FR</a>
      &middot;
      <a href="/pl/" hreflang="pl">PL</a>
    </nav>
    <main>
      <div class="no">NON</div>
      <button class="globe" type="button" aria-label="Explode">
        <img class="earth" src="/earth.gif" alt="" width="64" height="64" />
        <img class="explosion" src="/Explosion1.gif" alt="" width="64" height="64" hidden />
      </button>

    </main>
    <footer>
      <a href="https://fr.wikipedia.org/wiki/DEFCON">DEFCON 3</a> (estimé le 27 septembre 2026)
      &middot;
      <a href="https://fr.wikipedia.org/wiki/Horloge_de_l%27apocalypse">85 secondes avant minuit</a> (mis à jour le 27 janvier 2026)
    </footer>
    <script>
      var clicks = 0;
      document.querySelector(".globe").addEventListener("click", function () {
        if (++clicks < 5) return;
        var boom = this.querySelector(".explosion");
        boom.src = "/Explosion1.gif?" + Date.now();
        boom.hidden = false;
      });
    </script>
  </body>
</html>
