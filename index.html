<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="fr" href="/fr/" />
    <link rel="alternate" hreflang="pl" href="/pl/" />
    <title>HAS THE WORLD EXPLODED YET?</title>
  </head>
  <body>
    <nav class="lang">
      <a href="/" aria-current="page">EN</a>
      &middot;
      <a href="/fr/" hreflang="fr">FR</a>
      &middot;
      <a href="/pl/" hreflang="pl">PL</a>
    </nav>
    <main>

      <div class="no">NO</div>
      <button class="globe" type="button" aria-label="Explode">
        <img class="earth" src="/earth.gif" alt="" width="64" height="64" />
        <img class="explosion" src="/Explosion1.gif" alt="" width="64" height="64" hidden />
      </button>
    </main>
    <footer>
      
      <a href="https://en.wikipedia.org/wiki/DEFCON">DEFCON 3</a> (estimated September 27 2026)
      &middot;
      <!-- <a href="https://en.wikipedia.org/wiki/COGCON">COGCON 4</a> (updated Sep 27, 2026)
      &middot; -->
      <a href="https://en.wikipedia.org/wiki/Doomsday_Clock">85 seconds to midnight</a> (updated Jan 27, 2026)
      <!-- <a href="https://en.wikipedia.org/wiki/Waffle_House_Index">Waffle House Index: green</a> (updated Sep 27, 2026) -->
    </footer>
    <script>
      var clicks = 0;
      document.querySelector(".globe").addEventListener("click", function () {
        if (++clicks < 5) return;
        var boom = this.querySelector(".explosion");
        boom.src = "/Explosion1.gif?" + Date.now();
        boom.hidden = false;
      });
    </script>
  </body>
</html>
